<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header>
        <h1>Halaman Pendaftaran</h1>
    </header>

    <main>
        <form class="form-card" action="detail.html" method="get">
            <label for="nama">Nama:</label>
            <input id="nama" name="nama" type="text" required><br>
            <label for="email">Email:</label>
            <input id="email" name="email" type="email" placeholder="Email" required><br>
            <label for="no_hp">No HP:</label>
            <input id="no_hp" name="no_hp" type="text" placeholder="No HP" required><br>
            <label for="alamat">Alamat:</label>
            <input id="alamat" name="alamat" type="text" placeholder="Alamat" required><br>
            <label for="tanggal_lahir">Tanggal Lahir:</label>
            <input id="tanggal_lahir" name="tanggal_lahir" type="date" required><br>
            <p> Jenis Kelamin:</p>
            <label>
                <input name="jenis_kelamin" type="radio" value="Laki-laki" required> Laki-laki
            </label>
            <label>
                <input name="jenis_kelamin" type="radio" value="Perempuan" required> Perempuan
            </label>
            <button type="submit">Submit</button>
        </form>



    </main>

    <footer>
        Dzaky Faris Al Faqih | 124140077
    </footer>

</body>

</html>
